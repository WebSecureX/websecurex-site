<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSecureX | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00f7ff;
      --primary-glow: rgba(0, 247, 255, 0.7);
      --dark-bg: #060616;
      --secondary-bg: #0d0d2a;
      --text-light: #f0f0f0;
      --text-muted: #bbb;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at center, var(--secondary-bg), var(--dark-bg));
      color: var(--text-light);
      overflow-x: hidden;
    }

    /* Cyber Grid BG */
    .cyber-grid {
      position: fixed;
      inset: 0;
      background-image: linear-gradient(var(--primary-glow) 1px, transparent 1px),
                        linear-gradient(90deg, var(--primary-glow) 1px, transparent 1px);
      background-size: 55px 55px;
      opacity: 0.05;
      animation: gridMove 20s linear infinite;
      z-index: -1;
    }

    @keyframes gridMove {
      from { transform: translateY(0px); }
      to { transform: translateY(55px); }
    }

    /* Navbar */
    nav {
      width: 100%;
      padding: 20px 6%;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    nav img {
  height: 150px;  /* increased from 50px */
  filter: drop-shadow(0 0 12px var(--primary));
  transition: 0.3s ease;
}

nav img:hover {
  transform: scale(1.07);
}


    section {
      width: 90%;
      max-width: 1300px;
      margin: auto;
      padding: 90px 0;
      text-align: center;
    }

    h2 {
      font-size: 2.4rem;
      margin-bottom: 40px;
      color: var(--primary);
      text-shadow: 0 0 5px var(--primary-glow);
    }

    /* Scroll Animation */
    .reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: all .9s ease;
    }
    .reveal.active {
      opacity: 1;
      transform: translateY(0);
      filter: drop-shadow(0 0 1px var(--primary-glow));
    }

    /* Portfolio */
    .portfolio-grid {
      display: grid;
      gap: 30px;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
    }

    .project {
      background: rgba(255, 255, 255, 0.02);
      padding: 18px;
      border-radius: 14px;
      border: 1px solid rgba(0, 247, 255, 0.3);
      transition: .3s;
    }
    .project:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .project img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(0, 247, 255, 0.4);
    }

    .project-title {
      margin: 15px 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      margin: 10px 6px;
      border-radius: 6px;
      background: var(--primary);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      transition: 0.3s;
    }
    .btn:hover {
      box-shadow: 0 0 15px var(--primary-glow);
    }

    /* Footer CTA */
    .cta-footer {
      padding: 60px 0;
      text-align: center;
      background: rgba(255,255,255,0.03);
      border-top: 1px solid rgba(0,247,255,0.3);
      backdrop-filter: blur(8px);
      margin-top: 70px;
    }
    .cta-footer h3 {
      font-size: 2rem;
      text-shadow: 0 0 12px var(--primary-glow);
    }

    /* WhatsApp Floating Button */
    .whatsapp-float {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 65px;
      height: 65px;
      background: #25d366;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      z-index: 999;
      box-shadow: 0 0 12px #25d366;
    }
    .whatsapp-float img {
      width: 40px;
    }

    .navbar {
  width: 100%;
  padding: 18px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(6, 6, 22, 0.7);
  backdrop-filter: blur(12px);
  z-index: 999;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 35px;
}

.nav-links li a {
  text-decoration: none;
  color: var(--text-light);
  font-weight: 600;
  font-size: 1rem;
  position: relative;
  transition: 0.3s;
}

.nav-links li a:hover,
.nav-links li a.active {
  color: var(--primary);
  text-shadow: 0 0 8px var(--primary-glow);
}

.nav-links li a.active::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 100%;
  height: 3px;
  background: var(--primary);
  border-radius: 50px;
  box-shadow: 0 0 10px var(--primary-glow);
}

/* Mobile */
.menu-btn {
  display: none;
  font-size: 30px;
  cursor: pointer;
  color: var(--primary);
  text-shadow: 0 0 10px var(--primary-glow);
}

@media (max-width: 850px) {
  .nav-links {
    position: absolute;
    top: 80px;
    right: -100%;
    flex-direction: column;
    background: rgba(0, 0, 0, 0.85);
    width: 200px;
    padding: 30px 0;
    border-left: 1px solid var(--primary);
    transition: 0.4s ease;
    gap: 20px;
  }

  .nav-links.show {
    right: 0;
  }

  .menu-btn {
    display: block;
  }
}


  </style>
</head>

<!-- Scroll Animation Script -->
<script>
  function revealElements() {
    let reveals = document.querySelectorAll(".reveal");
    reveals.forEach(el => {
      const top = el.getBoundingClientRect().top;
      if (top < window.innerHeight - 80) {
        el.classList.add("active");
      }
    });
  }
  window.addEventListener("scroll", revealElements);
  revealElements();

  function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("show");
}

</script>
