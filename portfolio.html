<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSecureX | Portfolio</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
  --primary: #00f7ff;
  --primary-glow: rgba(0, 247, 255, 0.7);
  --dark-bg: #060616;
  --secondary-bg: #0d0d2a;
  --text-light: #f0f0f0;
  --text-muted: #bbb;
}

body {
  margin: 0;
  font-family: "Poppins", sans-serif;
  background: radial-gradient(circle at center, var(--secondary-bg), var(--dark-bg));
  color: var(--text-light);
  overflow-x: hidden;
}

/* Cyber Grid BG */
.cyber-grid {
  position: fixed;
  inset: 0;
  background-image: linear-gradient(var(--primary-glow) 1px, transparent 1px),
                    linear-gradient(90deg, var(--primary-glow) 1px, transparent 1px);
  background-size: 55px 55px;
  opacity: 0.05;
  animation: gridMove 20s linear infinite;
  z-index: -1;
}

@keyframes gridMove {
  from { transform: translateY(0px); }
  to { transform: translateY(55px); }
}

/* Navbar */
.navbar {
  width: 100%;
  padding: 12px 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(6, 6, 22, 0.7);
  backdrop-filter: blur(12px);
  z-index: 999;
}

.navbar img {
  height: 100px;
  transition: .3s;
}

.navbar img:hover {
  transform: scale(1.05);
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 30px;
}

.nav-links li a {
  text-decoration: none;
  color: var(--text-light);
  font-weight: 600;
  font-size: 1rem;
  position: relative;
  transition: 0.3s;
}

.nav-links li a:hover,
.nav-links li a.active {
  color: var(--primary);
  text-shadow: 0 0 8px var(--primary-glow);
}

/* Active underline */
.nav-links li a.active::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -6px;
  width: 100%;
  height: 3px;
  background: var(--primary);
  border-radius: 50px;
  box-shadow: 0 0 10px var(--primary-glow);
}

/* Hamburger Menu */
.menu-btn {
  display: none;
  font-size: 32px;
  cursor: pointer;
  color: var(--primary);
}

/* Sections */
section {
  width: 90%;
  max-width: 1300px;
  margin: auto;
  padding: 70px 0;
  text-align: center;
}

h2 {
  font-size: 2.1rem;
  margin-bottom: 35px;
  color: var(--primary);
}

/* Scroll Reveal */
.reveal { opacity: 0; transform: translateY(50px); transition: all .9s ease; }
.reveal.active { opacity: 1; transform: translateY(0px); }

/* Portfolio Cards */
.portfolio-grid {
  display: grid;
  gap: 25px;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.project {
  background: rgba(255,255,255,0.03);
  padding: 18px;
  border-radius: 12px;
  border: 1px solid rgba(0,247,255,0.4);
  transition: .3s;
}
.project:hover {
  transform: translateY(-8px);
  box-shadow: 0 0 18px var(--primary-glow);
}

.project img {
  width: 100%;
  border-radius: 10px;
}

/* Buttons */
.btn {
  display: inline-block;
  padding: 10px 18px;
  margin: 10px 6px;
  border-radius: 5px;
  background: var(--primary);
  color: #000;
  font-weight: bold;
  text-decoration: none;
}

/* CTA Footer */
.cta-footer {
  padding: 55px 0;
  margin-top: 50px;
  background: rgba(255,255,255,0.04);
  text-align: center;
}

/* WhatsApp Button */
.whatsapp-float {
  position: fixed;
  bottom: 18px;
  right: 18px;
  width: 60px;
  height: 60px;
  background: #25d366;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.whatsapp-float img { width: 38px; }

/* 📱 Mobile Responsive Fixes */
@media (max-width: 850px) {

  .navbar img {
    height: 70px;
  }

  .nav-links {
    position: absolute;
    top: 80px;
    right: -100%;
    width: 180px;
    flex-direction: column;
    padding: 25px 0;
    background: rgba(0,0,0,0.9);
    border-left: 2px solid var(--primary);
    gap: 20px;
    transition: .4s;
  }

  .nav-links.show {
    right: 0;
  }

  .menu-btn {
    display: block;
  }

  h2 { font-size: 1.7rem; }
  .btn { padding: 8px 14px; }
}

  </style>
</head>
<body>

<div class="cyber-grid"></div>

<!-- Scroll Animation Script -->
<script>
  function revealElements() {
    let reveals = document.querySelectorAll(".reveal");
    reveals.forEach(el => {
      const top = el.getBoundingClientRect().top;
      if (top < window.innerHeight - 80) {
        el.classList.add("active");
      }
    });
  }
  window.addEventListener("scroll", revealElements);
  revealElements();

  function toggleMenu() {
  document.getElementById("navLinks").classList.toggle("show");
}

</script>

</body>
